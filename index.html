<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aloy Port</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed top bar with tabs, one centred column of cards beneath. */
:root{
  --bg:#f5f6f3; --panel:#ffffff; --ink:#1c2420; --muted:#5f6b65; --line:#dde2dc;
  --accent:#1f5f4a; --accent-soft:#e3efe9; --pos:#1b7a4a; --neg:#b3402f; --warn:#9a6a12; --warn-soft:#fbf1dc;
  --bar-pos:#3f8f6b; --bar-neg:#c8705e; --bench:#8a8f8c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a201d; --ink:#e6ebe8; --muted:#9aa6a0; --line:#2c3531;
  --accent:#7cc4a4; --accent-soft:#1f3229; --pos:#6fcf9b; --neg:#ec8a76; --warn:#e2b45c; --warn-soft:#3a2f17;
  --bar-pos:#5aae88; --bar-neg:#d98472; --bench:#7d8682; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a201d; --ink:#e6ebe8; --muted:#9aa6a0; --line:#2c3531;
  --accent:#7cc4a4; --accent-soft:#1f3229; --pos:#6fcf9b; --neg:#ec8a76; --warn:#e2b45c; --warn-soft:#3a2f17;
  --bar-pos:#5aae88; --bar-neg:#d98472; --bench:#7d8682; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.2px}
.brand small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-left:8px}
.spacer{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
nav{display:flex;gap:4px;max-width:1200px;margin:8px auto 0;overflow-x:auto}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
main{max-width:1200px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .lab{font-size:12px;color:var(--muted)}
.tile .big{font-family:var(--display);font-size:26px;line-height:1.15;font-weight:500}
.tile .small{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
.banner b{color:inherit}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right}
td.name{white-space:normal;min-width:160px}
td .tk{font-family:var(--mono);font-size:12px;color:var(--muted)}
tr.off td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
input,select,textarea,button.btn{font:inherit;color:var(--ink)}
input[type=number],input[type=text],input[type=search],input[type=date],input[type=password],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0}
input.w{width:78px;text-align:right;font-variant-numeric:tabular-nums}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.chartbox{position:relative;height:280px}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 64px;align-items:center;gap:8px;font-size:12.5px}
.bar .track{position:relative;height:14px}
.bar .track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar .fill{position:absolute;top:2px;height:10px;border-radius:3px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.list{display:grid;gap:2px}
.li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.ac{position:relative;flex:1 1 260px;min-width:0}
.ac input{width:100%}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;max-height:320px;overflow:auto}
.ac-item{padding:8px 10px;cursor:pointer;display:flex;gap:8px;justify-content:space-between;font-size:13px}
.ac-item[aria-selected="true"],.ac-item:hover{background:var(--accent-soft)}
.ac-item .x{color:var(--muted);font-size:12px}
.totbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.totbar .meter{flex:1 1 200px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.totbar .meter i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
dialog .db{padding:14px 16px;display:grid;gap:10px;max-height:60vh;overflow:auto}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);
  padding:9px 14px;border-radius:8px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.tag.ow{background:var(--accent-soft);color:var(--pos)} .tag.uw{background:var(--warn-soft);color:var(--neg)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
@media (max-width:600px){ .tile .big{font-size:22px} .chartbox{height:220px} .hide-sm{display:none} }

.gsearch{flex:1 1 240px;max-width:420px;margin-left:auto}
.gsearch input{width:100%}
.slink{color:inherit;text-decoration:none;font-weight:500}
.slink:hover{text-decoration:underline;color:var(--accent)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
td.click{cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:focus-visible,.linkbtn:focus-visible,.hbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crumbs{font-size:13px;margin:4px 0 10px;color:var(--muted)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent)} .linkbtn:hover{text-decoration:underline}
.hbars{display:grid;gap:3px}
.hbar{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(100px,190px) 1fr 58px 34px;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;font-size:13px}
.hbar:hover{background:var(--accent-soft)}
.hbar .ht{height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.hbar .ht i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .hv{text-align:right} .hbar .hn{text-align:right;font-size:11.5px}
.lab2{font-size:12px;color:var(--muted);font-weight:500;margin:2px 0 6px}
table.heat th,table.heat td{padding:5px 6px;font-size:12px}
table.heat tbody th{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink);position:static}
.bar.cov{grid-template-columns:minmax(90px,150px) 1fr 44px}
.ctrack{height:10px;background:var(--line);border-radius:3px;overflow:hidden}
.ctrack i{display:block;height:100%;background:var(--accent)}
.tag.n{background:var(--line);color:var(--muted)}
.snip{white-space:normal;max-width:320px;color:var(--muted);font-size:12.5px}
h1.sname{font-family:var(--display);font-weight:500;font-size:28px;margin:0;line-height:1.2}
.callrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.callrow .lab2{margin:0}
textarea.note{width:100%;resize:vertical;line-height:1.55;font-size:14px;padding:10px 12px;min-height:64px;overflow:hidden}
.valbox,.peers{margin-top:12px}
table.fin input.yr{width:70px;text-align:right;font-weight:600;background:transparent;border-color:transparent}
table.fin input.fin-in{width:96px}
table.fin tbody th{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);position:static;font-weight:500}
table.fin tbody.derived th,table.fin tbody.derived td{color:var(--muted);font-size:12.5px}
table.fin tbody.derived tr:first-child th,table.fin tbody.derived tr:first-child td{border-top:2px solid var(--line)}
tr.selfrow td{background:var(--accent-soft)}
.log{display:grid;gap:10px;margin-top:12px}
.logi{border-left:3px solid var(--line);padding:4px 0 4px 12px}
.logt{white-space:pre-wrap;margin-top:4px}
table.views td.wide{width:45%}
table.views tbody th{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);position:static;font-weight:500}
@media (max-width:600px){ .gsearch{order:5;flex-basis:100%;max-width:none} h1.sname{font-size:22px} .hbar{grid-template-columns:minmax(80px,120px) 1fr 52px 28px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Aloy Port<small>MIAPJ · MYR</small></div>
    <div class="gsearch" id="gsearch"></div>
    <span class="pill" id="storePill">…</span>
    <span class="pill" id="pricePill">Prices: —</span>
  </div>
  <nav id="nav" aria-label="Sections">
    <button data-tab="home">Home</button>
    <button data-tab="stocks">Stocks</button>
    <button data-tab="views">Views</button>
    <button data-tab="portfolio">Model portfolio</button>
    <button data-tab="process">Process</button>
    <button data-tab="data">Data</button>
  </nav>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh" id="dlgTitle"></div><div class="db" id="dlgBody"></div><div class="df" id="dlgFoot"></div></form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* =========================================================================
   Aloy Port — model portfolio vs MIAPJ (MYR, total return)
   Storage: this browser until a Worker URL + passphrase are set on the Data tab,
   then the private Worker (Cloudflare KV). Prices: Yahoo via a Worker proxy.
   ========================================================================= */
const DEFAULT_PRICE_WORKER = "https://mamreg-api.mamreg.workers.dev";
const LS_STATE = "aloyport.state.v1", LS_CFG = "aloyport.cfg.v1";
const GICS = ["Information Technology","Materials","Industrials","Energy","Consumer Discretionary","Health Care","Consumer Staples","Utilities","Communication Services","Real Estate","Financials","Other"];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.setAttribute("style", v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const pct = (x, d = 1, sign = true) => x == null || !isFinite(x) ? "—" : (sign && x > 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const pp = (x, d = 2) => x == null || !isFinite(x) ? "—" : (x > 0 ? "+" : "") + (x * 100).toFixed(d);
const wfmt = (x, d = 2) => x == null || !isFinite(x) ? "—" : (x * 100).toFixed(d);
const cls = x => x == null || !isFinite(x) || Math.abs(x) < 1e-12 ? "" : x > 0 ? "pos" : "neg";
const num = (x, d = 2) => x == null || !isFinite(x) ? "—" : x.toLocaleString("en", {minimumFractionDigits: d, maximumFractionDigits: d});
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const sum = a => a.reduce((s, x) => s + x, 0);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600); }
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

/* ---------- config & state ---------- */
const cfg = Object.assign({ priceWorker: DEFAULT_PRICE_WORKER, stateWorker: "", token: "" }, JSON.parse(safeGet(LS_CFG) || "{}"));
function saveCfg() { safeSet(LS_CFG, JSON.stringify(cfg)); }
const blankState = () => ({ v: 1, snapshots: [], indexLevels: [], portfolio: { events: [] }, stocks: {}, yahoo: {}, notes: {}, views: { country: {}, sector: {}, overall: "" }, process: {}, updated: null });
const dump = (x, sp) => JSON.stringify(x, (k, v) => k.startsWith("_") ? undefined : v, sp);
let S = blankState();
let mode = "local"; // local | cloud | viewer
let saveTimer = null;

async function api(path, opts = {}) {
  const base = (cfg.stateWorker || "").replace(/\/+$/, "");
  const r = await fetch(base + path, { ...opts, headers: { "content-type": "application/json", authorization: "Bearer " + cfg.token, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
}
async function loadState() {
  if (cfg.stateWorker && cfg.token) {
    try {
      const who = await api("/me");
      const d = await api("/state");
      S = Object.assign(blankState(), d && d.v ? d : {});
      mode = who.role === "viewer" ? "viewer" : "cloud";
      return;
    } catch (e) { toast("Could not reach the Worker, using this browser's copy: " + e.message); }
  }
  const raw = safeGet(LS_STATE);
  if (raw) { try { S = Object.assign(blankState(), JSON.parse(raw)); } catch {} }
  mode = "local";
}
function persist() {
  if (mode === "viewer") return;
  S.updated = new Date().toISOString();
  safeSet(LS_STATE, dump(S)); // always keep a local copy as backup
  if (mode === "cloud") {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await api("/state", { method: "PUT", body: dump(S) }); setPills(); }
      catch (e) { toast("Cloud save failed: " + e.message); }
    }, 500);
  }
}
function setPills() {
  const p = $("#storePill");
  if (mode === "cloud") { p.className = "pill ok"; p.textContent = "Saved to cloud"; }
  else if (mode === "viewer") { p.className = "pill ok"; p.textContent = "View only"; }
  else { p.className = "pill warn"; p.textContent = "Saved in this browser only"; }
}
const canEdit = () => mode !== "viewer";

/* ---------- index data ---------- */
const latestSnap = () => S.snapshots.length ? S.snapshots[S.snapshots.length - 1] : null;
function snapMap(snap = latestSnap()) { const m = new Map(); if (snap) for (const r of snap.rows) m.set(r.code, r); return m; }
function stockInfo(code) {
  let r = snapMap().get(code);
  if (!r) for (let i = S.snapshots.length - 2; i >= 0 && !r; i--) { const old = S.snapshots[i].rows.find(x => x.code === code); if (old) { const e = S.stocks[code] || {}; return { code, name: old.name, country: old.country, sector: old.sector, iw: 0, inIndex: false, removed: true, ...e, name: old.name }; } }
  const extra = S.stocks[code] || {};
  if (r) return { code, name: r.name, country: r.country, sector: r.sector, iw: r.weight, inIndex: true, ...extra, name: r.name };
  return { code, name: extra.name || code, country: extra.country || "Other", sector: extra.sector || "Other", iw: 0, inIndex: false, ...extra };
}
const tidy = s => String(s ?? "").replace(/\s+/g, " ").trim();
const titleCountry = c => { c = tidy(c).toUpperCase(); return c === "SOUTH KOREA" || c === "KOREA" ? "Korea" : c.split(" ").map(w => w ? w[0] + w.slice(1).toLowerCase() : w).join(" "); };

/* Bloomberg code -> Yahoo symbol candidates */
function yahooCandidates(code) {
  if (code.startsWith("Y:")) return [code.slice(2)];
  const [t, sfx] = code.split(" ");
  const pad4 = x => /^\d+$/.test(x) ? x.padStart(4, "0") : x;
  switch (sfx) {
    case "KP": case "KS": return [t + ".KS", t + ".KQ"];
    case "KQ": return [t + ".KQ", t + ".KS"];
    case "TT": return [t + ".TW", t + ".TWO"];
    case "AT": case "AU": return [t + ".AX"];
    case "IS": case "IN": case "IB": return [t + ".NS", t + ".BO"];
    case "HK": return [pad4(t) + ".HK"];
    case "C1": case "CH": case "CG": return [t + ".SS", t + ".SZ"];
    case "C2": case "CS": return [t + ".SZ", t + ".SS"];
    case "SP": return [t + ".SI"];
    case "TB": return [t + ".BK"];
    case "IJ": return [t + ".JK"];
    case "PM": return [t + ".PS"];
    case "NZ": return [t + ".NZ"];
    case "CN": return [t + ".TO"];
    case "MK": return []; // Bursa needs the numeric code: resolved by name search
    default: return [t];
  }
}

/* ---------- prices ---------- */
const chartCache = new Map();
async function chart(sym, range = "2y") {
  const key = sym + "|" + range;
  if (chartCache.has(key)) return chartCache.get(key);
  const p = (async () => {
    const r = await fetch(cfg.priceWorker.replace(/\/+$/, "") + "/chart?symbol=" + encodeURIComponent(sym) + "&range=" + range);
    if (!r.ok) throw new Error("price " + r.status);
    const d = await r.json();
    const res = d && d.chart && d.chart.result && d.chart.result[0];
    if (!res || !res.timestamp) throw new Error("no data for " + sym);
    const off = (res.meta && res.meta.gmtoffset) || 0;
    const adj = (res.indicators.adjclose && res.indicators.adjclose[0] && res.indicators.adjclose[0].adjclose) || [];
    const cl = (res.indicators.quote && res.indicators.quote[0] && res.indicators.quote[0].close) || [];
    const m = new Map();

function autocomplete(onPick) {
  const wrap = el("div", { class: "ac" });
  const inp = el("input", { type: "search", placeholder: "Add a stock: ticker or name (e.g. hynix, 2454, BHP)", "aria-label": "Search stocks", autocomplete: "off", role: "combobox", "aria-expanded": "false" });

  const show = () => {

    const rows = latestSnap() ? latestSnap().rows : [];
    items = rows.filter(r => r.code.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)).sort((a, b) => b.weight - a.weight).slice(0, 8)

    show();

    if (q.length >= 2) timer = setTimeout(async () => {

        const hits = await searchYahoo(q);
        if (my !== seq) return;
        const known = new Set(Object.values(S.yahoo));
        for (const h of hits.filter(h => h.type === "EQUITY" && !known.has(h.symbol)).slice(0, 6)) items.push({ yahoo: h, label: h.name + "  " + h.symbol, hint: (h.exchange || "") + " · off-benchmark" });
        show();

    if (e.key === "ArrowDown") { sel = Math.min(items.length - 1, sel + 1); show(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); show(); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(sel >= 0 ? sel : 0); }

}

    }
    if (!n) throw new Error("No date/level rows found.");
    S.indexLevels = [...out.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([date, level]) => ({ date, level }));
    persist(); render(); toast(n + " index levels loaded.");
  } catch (e) { toast("Upload failed: " + e.message); }
}

/* ---------- boot ---------- */
(async function boot() {
  await loadState(); setPills(); render();
  mountGlobalSearch();
  window.addEventListener("hashchange", () => { const t = decodeURIComponent(location.hash.replace("#", "")) || "home"; if (t !== tab) { tab = t; render(); } });
})();
</script>
</body>
